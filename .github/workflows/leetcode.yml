name: Refresh LeetCode card

# LeetCode can't notify GitHub, so poll hourly. The card only changes when
# the stats change (or a new week starts), and we only commit then.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leetcode-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/cache@v4
        with:
          path: scripts/.fonts
          key: fonts-jetbrains-mono-v1
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/build_profile.py
      - name: Commit if the card changed
        run: |
          git add assets
          if git diff --cached --quiet; then
            echo "Stats unchanged, nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh LeetCode card"
            git push
          fi
